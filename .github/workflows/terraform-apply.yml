name: "Terraform Apply (Production Deployment)"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  id-token: write      # Required for Workload Identity Federation
  contents: read       # Required to checkout repository

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud (Keyless WIF)"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/396356872723/locations/global/workloadIdentityPools/github-actions-pool-1021e058/providers/github-actions-provider"
          service_account: "sa-terraform-cicd@vigilant-cider-502720-m5.iam.gserviceaccount.com"

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Apply"
        run: terraform apply -auto-approve -input=false

      - name: "Terraform Outputs Summary"
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Infrastructure Successfully Deployed via GitOps
          ```
          EOF
          terraform output >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
